name: Windows MSVC compile evidence

# Deliberately manual: this builds test executables; it does not run or certify
# Windows 7/10/11, deploy a product, publish a release, or install a user machine.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected full 40-character source Git SHA; reject a moved dispatch ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-i686:
    if: github.repository == 'NevermoreN/future-classroom'
    runs-on: windows-2022
    timeout-minutes: 135
    defaults:
      run:
        shell: pwsh
    env:
      FC_MSVC_RUN_ROOT: ${{ runner.temp }}\future-classroom-msvc-${{ github.run_id }}-${{ github.run_attempt }}
      FC_MSVC_EXPECTED_SHA: ${{ inputs.source_sha }}
      FC_MSVC_DISPATCH_SHA: ${{ github.sha }}
    steps:
      - name: Create this run's bounded evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Hosted runner required.' }
          if (Test-Path -LiteralPath $env:FC_MSVC_RUN_ROOT) { throw 'Run directory already exists; preserve earlier evidence.' }
          New-Item -ItemType Directory -Path "$env:FC_MSVC_RUN_ROOT\artifact\logs" | Out-Null
          [IO.File]::WriteAllText("$env:FC_MSVC_RUN_ROOT\.owner", 'future-classroom-msvc-ci/v1')
          [ordered]@{
            stage = 'before_checkout'; expected_source_sha = $env:FC_MSVC_EXPECTED_SHA
            dispatch_source_sha = $env:FC_MSVC_DISPATCH_SHA
            workflow_sha = $env:GITHUB_WORKFLOW_SHA; repository = $env:GITHUB_REPOSITORY
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_image = $env:ImageOS; runner_image_version = $env:ImageVersion
            role = 'modern-msvc-compilation-only'; windows_runtime_tests = 'NOT_RUN'
          } | ConvertTo-Json | Set-Content -LiteralPath "$env:FC_MSVC_RUN_ROOT\artifact\bootstrap.json" -Encoding utf8NoBOM
          if ($env:FC_MSVC_EXPECTED_SHA -notmatch '\A[0-9a-fA-F]{40}\z' -or
              $env:FC_MSVC_DISPATCH_SHA -notmatch '\A[0-9a-fA-F]{40}\z') {
            throw 'source_sha and dispatch SHA must each be exactly 40 hexadecimal characters.'
          }
          if ($env:FC_MSVC_EXPECTED_SHA -ine $env:FC_MSVC_DISPATCH_SHA) {
            throw 'Dispatch ref moved or differs from requested source_sha; no checkout/build admitted.'
          }

      # Official action release v7.0.1, full immutable commit; no persisted PAT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compile MSVC workspace and collect original evidence
        timeout-minutes: 105
        run: |
          ./scripts/windows-msvc-ci.ps1 -Mode Build -RunRoot $env:FC_MSVC_RUN_ROOT -ExpectedSourceSha $env:FC_MSVC_EXPECTED_SHA

      - name: Clean only this ephemeral run's build and tool roots
        if: always()
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath './scripts/windows-msvc-ci.ps1') {
            ./scripts/windows-msvc-ci.ps1 -Mode Cleanup -RunRoot $env:FC_MSVC_RUN_ROOT
          } else {
            # Checkout never supplied the script: no compiler was started.
            @{ status = 'BUILD_NOT_STARTED'; reason = 'checkout did not provide cleanup script' } |
              ConvertTo-Json | Set-Content -LiteralPath "$env:FC_MSVC_RUN_ROOT\artifact\cleanup.json" -Encoding utf8NoBOM
          }

      # Official v7.0.2. Original logs/partial products survive ordinary failures.
      # Job/VM termination can still interrupt upload; no artifact is presumed.
      - name: Upload original logs, metadata and compiled test executables
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: future-classroom-msvc-i686-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FC_MSVC_RUN_ROOT }}\artifact
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
          overwrite: false

      # The uploaded evidence is intentionally retained until GitHub disposes
      # this job's fresh hosted VM. No user's Windows/NAS directories are touched.
