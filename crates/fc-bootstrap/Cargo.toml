[package]
name = "fc-bootstrap"
default-run = "fc-bootstrap"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
owned-test-removal = ["fc-windows/owned-test-removal"]
school-gateway = ["dep:rcgen", "dep:rustls", "dep:rsa", "dep:rand", "dep:pkcs8", "dep:time", "dep:serde", "dep:serde_json", "dep:sha2"]

[[bin]]
name = "fc-bootstrap"
path = "src/main.rs"

[[bin]]
name = "fc-installer-lifecycle"
path = "src/bin/fc-installer-lifecycle.rs"

[[bin]]
name = "fc-school-gateway"
path = "src/bin/fc-school-gateway.rs"
required-features = ["school-gateway"]

[dependencies]
fc-domain.workspace = true
fc-ports.workspace = true
fc-runtime.workspace = true
fc-application.workspace = true
fc-storage.workspace = true
fc-security.workspace = true
fc-materials.workspace = true
fc-audio.workspace = true
fc-presentation.workspace = true
fc-protocol.workspace = true
fc-windows.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "ring", "x509-parser"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rsa = { version = "=0.9.10", optional = true }
rand = { version = "=0.8.8", optional = true }
pkcs8 = { version = "=0.10.2", features = ["encryption", "pem"], optional = true }
time = { version = "=0.3.55", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
